[package]
name = "floresline-launcher"
version = "0.1.0"
edition = "2021"
description = "Floresline GNOME fuzzy app launcher (Rust + GTK4 port, WIP)"
license = "MIT"
publish = false

[dependencies]
# gtk4 crate renamed to `gtk` (gtk-rs convention). Feature `v4_12` matches
# Ubuntu 24.04+ GTK. Bump the crate version and/or feature (e.g. v4_14) when
# targeting newer GTK APIs — see https://gtk-rs.org/gtk4-rs/stable/latest/book/
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
