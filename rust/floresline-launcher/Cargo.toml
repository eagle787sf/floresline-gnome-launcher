[package]
name = "floresline-launcher"
version = "0.2.8"
edition = "2021"
description = "Floresline GNOME fuzzy app launcher (Rust + GTK4)"
license = "MIT"
publish = false

[dependencies]
# gtk4 crate renamed to `gtk` (gtk-rs convention). Feature `v4_12` matches
# Ubuntu 24.04+ GTK. Bump the crate version and/or feature (e.g. v4_14) when
# targeting newer GTK APIs — see https://gtk-rs.org/gtk4-rs/stable/latest/book/
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
shlex = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
toml = "0.8"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
